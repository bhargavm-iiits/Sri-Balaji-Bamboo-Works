function normalizeCart(value){
 if(!Array.isArray(value))return [];
 const result=[];
 for(const item of value){
  if(!item)continue;
  const p=findProduct(item.id);if(!p)continue;
  const number=Number(item.quantity);if(!Number.isFinite(number))continue;
  const quantity=Math.min(99,Math.max(0,Math.trunc(number)));if(!quantity)continue;
  const size=p.options.includes(item.size)?item.size:p.options[0];
  const lengthFeet=p.unit==='foot'?Number(item.lengthFeet):null;
  if(p.unit==='foot'&&(!Number.isFinite(lengthFeet)||lengthFeet<1||lengthFeet>1000))continue;
  const existing=result.find(x=>x.id===p.id&&x.size===size&&x.lengthFeet===lengthFeet);
  if(existing)existing.quantity=Math.min(99,existing.quantity+quantity);
  else result.push({id:p.id,size,quantity,lengthFeet});
 }
 return result;
}
function lineQuote(item){
 const p=findProduct(item.id);if(!p||p.price===null)return {low:0,high:0,pending:true};
 const factor=item.quantity*(p.unit==='foot'?item.lengthFeet:1);
 return {low:Math.round(p.price*factor*100)/100,high:Math.round((p.priceMax??p.price)*factor*100)/100,pending:false};
}
function quoteTotals(cart){
 return normalizeCart(cart).reduce((total,item)=>{const line=lineQuote(item);return {low:Math.round((total.low+line.low)*100)/100,high:Math.round((total.high+line.high)*100)/100,pending:total.pending||line.pending};},{low:0,high:0,pending:false});
}

function setupLandingScene(){

 };

const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');

function setupMotion(){
 motionCleanup();

 const journey=document.querySelector('.collection-journey');
 const track=journey?.querySelector('.journey-track');
 const panels=journey?[...journey.querySelectorAll('.journey-panel')]:[];
 const wide=matchMedia('(min-width: 1000px) and (min-height: 700px)');
 let motionFrame=0;
 let observer;
 const sync=()=>{
  const active=motionEnabled();
  landingMotion.setEnabled(active);
  document.documentElement.classList.toggle('motion-off',!active);
  document.querySelectorAll('[data-motion]').forEach(b=>{b.textContent=active?'Motion: On':'Motion: Off';b.setAttribute('aria-pressed',String(active));b.disabled=motionQuery.matches;});
  const horizontal=active&&wide.matches&&!!journey;
  journey?.classList.toggle('journey-horizontal',horizontal);

  if(!horizontal&&track)track.style.removeProperty('transform');
  update();
 };
 const update=()=>{
  cancelAnimationFrame(motionFrame);
  motionFrame=requestAnimationFrame(()=>{
   if(!journey?.classList.contains('journey-horizontal'))return;
   const rect=journey.getBoundingClientRect();
   const top=document.getElementById('header').offsetHeight;
   const travel=journey.offsetHeight-innerHeight+top;
   const progress=Math.max(0,Math.min(1,(top-rect.top)/Math.max(1,travel)));
   track.style.transform=`translate3d(${-progress*(track.scrollWidth-track.parentElement.clientWidth)}px,0,0)`;
   journey.style.setProperty('--progress',progress);
   const chapter=Math.round(progress*(panels.length-1));
   journey.querySelectorAll('[data-chapter]').forEach((b,i)=>{b.classList.toggle('active',i===chapter);b.setAttribute('aria-current',i===chapter?'step':'false');});
   const counter=journey.querySelector('.journey-counter');if(counter)counter.textContent=String(chapter+1).padStart(2,'0')+' / '+String(panels.length).padStart(2,'0');
  });
 };
 const choose=event=>{
  const button=event.target.closest('[data-chapter]');if(!button||!journey)return;
  const index=Number(button.dataset.chapter);
  if(journey.classList.contains('journey-horizontal')){
   const top=document.getElementById('header').offsetHeight;
   const start=journey.getBoundingClientRect().top+scrollY-top;
   scrollTo({top:start+(journey.offsetHeight-innerHeight+top)*index/(panels.length-1),behavior:'smooth'});
  }else panels[index]?.scrollIntoView({behavior:motionEnabled()?'smooth':'instant',block:'start'});
 };
 // Keyboard focus moves the native page to the corresponding chapter too.
 const focusChapter=event=>{
  if(!journey?.classList.contains('journey-horizontal'))return;

  const top=document.getElementById('header').offsetHeight;
  const index=panels.indexOf(panel);const start=journey.getBoundingClientRect().top+scrollY-top;

 };
 if('IntersectionObserver' in window){
  observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');observer.unobserve(e.target);}}),{threshold:.06});

 }
 journey?.addEventListener('click',choose);journey?.addEventListener('focusin',focusChapter);
 addEventListener('scroll',update,{passive:true});addEventListener('resize',sync);motionQuery.addEventListener('change',sync);
 const toggle=()=>{motionPaused=!motionPaused;try{localStorage.setItem('sbb-motion',motionPaused?'off':'on');}catch{}sync();};
 document.querySelectorAll('[data-motion]').forEach(b=>b.addEventListener('click',toggle));
 sync();
 motionCleanup=()=>{landingMotion.destroy();cancelAnimationFrame(motionFrame);observer?.disconnect();removeEventListener('scroll',update);removeEventListener('resize',sync);motionQuery.removeEventListener('change',sync);journey?.removeEventListener('click',choose);journey?.removeEventListener('focusin',focusChapter);document.querySelectorAll('[data-motion]').forEach(b=>b.removeEventListener('click',toggle));};
}

async function flowApi(url,{method='GET',body,token}={}){
 if(!/^https?:$/.test(location.protocol))throw new Error('Order approval requires the running website server. Open http://localhost:4173/.');
 let response;try{response=await fetch(url,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});}catch{throw new Error('Cannot reach the order server. Your selection is preserved. Please try again.');}
 let data;try{data=await response.json();}catch{throw new Error('The order server is unavailable. Please try again.');}
 if(!response.ok){const error=new Error(data.error||'Please try again.');error.status=response.status;throw error;}return data;
}
async function placeOrder(details,items){
 const fingerprint=JSON.stringify({details,items});if(!flowDraft||flowDraft.fingerprint!==fingerprint){let stored;try{stored=JSON.parse(sessionStorage.getItem('sbb-order-draft')||'null');}catch{}flowDraft=stored?.fingerprint===fingerprint?stored:{fingerprint,key:[...crypto.getRandomValues(new Uint8Array(32))].map(n=>n.toString(16).padStart(2,'0')).join('')};try{sessionStorage.setItem('sbb-order-draft',JSON.stringify(flowDraft));}catch{}}
 const {order}=await flowApi('/api/orders',{method:'POST',body:{details,items,clientKey:flowDraft.key}});flowKeys[order.id]=flowDraft.key;flowSave();try{sessionStorage.removeItem('sbb-order-draft');}catch{}flowDraft=null;return order;
}
function orderPage(kind){const text={orders:['YOUR ORDER, AT EVERY STEP','Your order <em>updates.</em>','Owner approval comes first. Your payment button appears once the final total is confirmed.'],payment:['DIRECT TO THE WORKSHOP','Confirm, then <em>pay.</em>','Payment opens only for an order approved by the workshop.']}[kind];return `<section class="container section order-page"><span class="eyebrow">${text[0]}</span><h1>${text[1]}</h1><p class="intro">${text[2]}</p><div id="order-feedback" role="status" tabindex="-1"></div><div id="order-flow" aria-live="polite"><p>Loading your order…</p></div></section>`;}
const flowItems=o=>`<ul class="order-lines">${o.items.map(i=>`<li><span>${flowEsc(i.name)} <small lang="kn">${flowEsc(i.nameKn)}</small><small>${flowEsc(i.size)}${i.lengthFeet?' · '+i.lengthFeet+' ft':''} · Qty ${i.quantity}${i.unit==='pair'?' pairs':''}</small></span></li>`).join('')}</ul>`;
const flowSummary=o=>`<div class="order-heading"><div><span class="eyebrow">${flowEsc(o.id)}</span><h2>${flowStates[o.status]||'Order update'}</h2></div><span class="order-date">${new Date(o.createdAt).toLocaleDateString('en-IN')}</span></div>${flowItems(o)}${o.approvedTotal!==null?`<p class="approved-total">Final total <strong>${money(o.approvedTotal/100)}</strong><small>Includes the delivery and specifications agreed with the workshop.</small></p>`:`<p class="small muted">Product estimate: ${money(o.estimate.low)}${o.estimate.low!==o.estimate.high?'–'+money(o.estimate.high):''}. Final total, units, specifications and delivery require owner confirmation.</p>`}${o.ownerNote?`<div class="owner-note"><strong>Workshop note</strong><p>${flowEsc(o.ownerNote)}</p></div>`:''}`;
const flowTrackingUrl=id=>`${location.origin}/#/orders?order=${encodeURIComponent(id)}&access=${flowKeys[id]}`;
function flowCustomerCard(o){const message=`New order request ${o.id}. Please review availability, specifications and final total in your private workshop inbox.`;const notice=o.notification?.status==='accepted'?'WhatsApp alert submitted to the provider. Delivery has not been verified.':o.notification?.status==='failed'?'Automatic WhatsApp alert failed. Please notify the owner using the button below.':'Automatic WhatsApp alerts are not connected. Use the button below to notify the owner.';
 return `<article class="order-card">${flowSummary(o)}${o.status==='pending'?`<div class="request-notice"><strong>Your request is saved. Approval is pending.</strong><p>${notice}</p></div><a class="button button-outline" href="https://wa.me/919591457484?text=${encodeURIComponent(message)}" target="_blank" rel="noopener noreferrer">Notify owner on WhatsApp ↗</a>`:''}${o.status==='approved'?`<div class="request-notice"><strong>The owner has approved your order.</strong><p>Check the final total and workshop note, then choose Confirm & pay to view the QR.</p></div><a class="button" href="/payment?order=${o.id}">Confirm &amp; pay ${money(o.approvedTotal/100)} →</a>`:''}${o.status==='payment_reported'?`<div class="request-notice"><strong>Your payment is awaiting the owner’s check.</strong><p>Reference: ${flowEsc(o.paymentReference)}. This is not proof of payment. Avoid paying twice.</p></div><a class="text-link" href="/payment?order=${o.id}">Review payment details →</a>`:''}${o.status==='paid'?'<div class="request-notice"><strong>Payment receipt confirmed by the owner.</strong><p>Contact the workshop for delivery updates.</p></div>':''}<details class="tracking-details"><summary>Your private tracking link</summary><p>Saved on this browser. Keep this link private; open it on another device to view this order there.</p><button type="button" class="button button-outline" data-copy-order="${o.id}">Copy private tracking link</button><input class="tracking-link" aria-label="Private tracking link for ${o.id}" readonly value="${flowEsc(flowTrackingUrl(o.id))}"></details></article>`;
}
async function flowLoadCustomers(generation){
 const root=document.querySelector('#order-flow');if(!root)return;
 if(!Object.keys(flowKeys).length){root.innerHTML='<div class="request-notice"><h2>No saved orders yet.</h2><p>Submit your bag for owner approval. If you ordered on another device, open the private tracking link saved on that device.</p><a class="button" href="/shop">Explore the collection →</a></div>';return;}
 const results=await Promise.all(Object.keys(flowKeys).reverse().slice(0,30).map(async id=>{try{return {order:(await flowApi('/api/orders/'+id,{token:flowKeys[id]})).order};}catch(e){return {id,error:e.message};}}));if(generation!==flowGeneration)return;
 const fingerprint=JSON.stringify(results);if(fingerprint===flowFingerprint)return;flowFingerprint=fingerprint;root.innerHTML=`<div class="order-toolbar"><p>Updates refresh every 15 seconds while this page is open.</p><button class="button button-outline" data-refresh-orders>Refresh status</button></div>${results.map(r=>r.order?flowCustomerCard(r.order):`<div class="request-notice"><strong>${flowEsc(r.id)}</strong><p>${flowEsc(r.error)}</p></div>`).join('')}`;
}
async function flowLoadPayment(generation,params){const root=document.querySelector('#order-flow');const id=params.get('order');if(!id||!flowKeys[id]){root.innerHTML='<div class="request-notice"><h2>Owner approval comes first.</h2><p>Open My orders and choose Confirm &amp; pay on an approved request. If you used another device, open your private tracking link first.</p><a class="button" href="/orders">My orders →</a></div>';return;}
 try{const {order:o,payment:p}=await flowApi('/api/orders/'+id+'/payment',{token:flowKeys[id]});if(generation!==flowGeneration)return;root.innerHTML=`<div class="payment-layout"><figure class="payment-qr"><img src="${flowEsc(p.qrImage)}" width="848" height="1205" alt="Original merchant UPI QR for Sri Balaji Bamboo Work"><figcaption>Original merchant QR supplied by the workshop.</figcaption><a class="text-link" href="${flowEsc(p.qrImage)}" download="Sri-Balaji-UPI-QR.jpg">Save payment QR ↓</a></figure><div class="payment-instructions"><span class="eyebrow">${flowEsc(o.id)}</span><h2>${o.status==='payment_reported'?'Payment reference received.':'Your approved order.'}</h2><p class="approved-total">Pay exactly <strong>${money(o.approvedTotal/100)}</strong></p>${o.ownerNote?`<p class="owner-note">${flowEsc(o.ownerNote)}</p>`:''}<dl class="payment-details"><div><dt>Merchant name</dt><dd>${flowEsc(p.merchantName)}</dd></div><div><dt>UPI ID</dt><dd>${flowEsc(p.upiId)}</dd></div></dl><ol class="payment-steps"><li>Scan the QR with your UPI app. On the same phone, save the QR and use your app’s image scan option if available.</li><li>Check the recipient and pay only the approved total shown above.</li><li>Enter your UPI transaction reference below. The owner checks actual receipt before marking the order paid.</li></ol>${o.status==='payment_reported'?`<div class="payment-notice"><strong>Verification pending. Avoid paying twice.</strong><p>Submitted reference: ${flowEsc(o.paymentReference)}.</p></div>`:''}<form id="payment-report-form" data-order="${o.id}" class="form-panel"><h3>${o.status==='payment_reported'?'Correct your transaction reference':'Already paid in your UPI app?'}</h3><label for="payment-reference">UPI transaction reference</label><input id="payment-reference" name="reference" minlength="6" maxlength="80" pattern="[A-Za-z0-9 -]{6,80}" value="${flowEsc(o.paymentReference)}" required><button class="button" type="submit">Submit reference for verification</button><p class="small muted">This does not confirm payment. The workshop verifies receipt manually.</p></form><a class="text-link" href="/orders">Back to My orders →</a></div></div>`;}catch(e){if(generation===flowGeneration)root.innerHTML=`<div class="request-notice"><h2>Payment is not available.</h2><p>${flowEsc(e.message)}</p><a class="button" href="/orders">Check order status →</a></div>`;}}
function mountOrders(route,params){
 clearInterval(flowTimer);flowGeneration++;flowRoute=route;flowFingerprint='';const generation=flowGeneration;
 if(route==='/orders'){const id=params.get('order'),key=params.get('access');if(/^SBB-[A-F0-9]{12}$/.test(id||'')&&/^[a-f0-9]{64}$/.test(key||'')){flowKeys[id]=key;flowSave();history.replaceState(null,'','/orders');}flowLoadCustomers(generation);flowTimer=setInterval(()=>{if(!document.hidden&&!flowBusy)flowLoadCustomers(generation);},15000);}
 if(route==='/payment')flowLoadPayment(generation,params);
 if(!['/orders','/payment'].includes(route)&&Object.keys(flowKeys).length){const main=document.querySelector('#main');const banner=document.createElement('aside');banner.className='customer-order-banner container';banner.innerHTML='<span>You have saved order requests.</span><a href="/orders">View My orders →</a>';main.prepend(banner);Promise.all(Object.entries(flowKeys).slice(-10).map(async([id,key])=>{try{return (await flowApi('/api/orders/'+id,{token:key})).order;}catch{return null;}})).then(orders=>{if(generation!==flowGeneration)return;const approved=orders.find(o=>o?.status==='approved');if(approved)banner.innerHTML=`<span>Order ${flowEsc(approved.id)} approved · ${money(approved.approvedTotal/100)}</span><a href="/payment?order=${approved.id}">Confirm &amp; pay →</a>`;});}
}
function flowFeedback(message,error=false){const box=document.querySelector('#order-feedback');if(box){box.className=error?'order-feedback error-summary':'order-feedback request-notice';box.textContent=message;box.focus();}}
function setupOrderEvents(){
 document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-refresh-orders')){flowFingerprint='';flowLoadCustomers(flowGeneration);}
  if(button.dataset.copyOrder){try{await navigator.clipboard.writeText(flowTrackingUrl(button.dataset.copyOrder));flowFeedback('Private tracking link copied. Keep it safe.');}catch{flowFeedback('Select and copy the private tracking link shown below.');button.parentElement.querySelector('input').select();}}
 });
 document.addEventListener('submit',async event=>{
  const form=event.target;if(!form.matches('#payment-report-form'))return;event.preventDefault();if(flowBusy||!form.reportValidity())return;flowBusy=true;const button=form.querySelector('button[type="submit"]');button.disabled=true;const generation=flowGeneration;
  try{const values=Object.fromEntries(new FormData(form));
   await flowApi('/api/orders/'+form.dataset.order+'/report',{method:'POST',token:flowKeys[form.dataset.order],body:{reference:values.reference}});location.hash='/orders';
  }catch(e){if(generation===flowGeneration)flowFeedback(e.message,true);}finally{flowBusy=false;button.disabled=false;}
 });
 window.addEventListener('focus',()=>{if(flowRoute==='/orders'&&!flowBusy)flowLoadCustomers(flowGeneration);});
}

  if(target.hasAttribute('data-search')){$('#search-dialog').showModal();return;}
  if(target.hasAttribute('data-close-dialog')){$('#search-dialog').close();return;}
  if(target.hasAttribute('data-menu')){const nav=$('#mobile-nav');nav.hidden=!nav.hidden;target.setAttribute('aria-expanded',String(!nav.hidden));return;}
  if(target.hasAttribute('data-category')){location.hash='/shop'+(target.dataset.category?'?category='+target.dataset.category:'');return;}
  if(target.hasAttribute('data-clear-filters')){shopState={category:'',query:'',sort:'featured'};$('#collection-search').value='';$('#sort').value='featured';updateShop();return;}
  if(target.dataset.scroll){event.preventDefault();const destination=document.getElementById(target.dataset.scroll);destination?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});if(destination?.matches('input,select,textarea'))destination.focus({preventScroll:true});return;}
  if(target.hasAttribute('data-thumb')){
    const p=findProduct(target.dataset.product);const detail=target.dataset.thumb==='detail';const original=!['primary','detail'].includes(target.dataset.thumb);$('#product-main-image').innerHTML=detail?photo(p,'weave-detail'):original?`<img class="original-product-image" src="assets/${target.dataset.thumb}" alt="${p.name}, original workshop photograph">`:photo(p);
    $('#photo-caption').textContent=detail?'Close-up from the same product photograph.':original?'Workshop photograph. Product colour and weave may vary.':'Workshop photo · Cropped to focus on the product. Use the controls to tilt the photo.';
    document.querySelectorAll('[data-thumb]').forEach(b=>{b.classList.toggle('active',b===target);b.setAttribute('aria-pressed',String(b===target));});return;
  }
  if(target.hasAttribute('data-product-qty')){productQuantity=Math.min(99,Math.max(1,productQuantity+Number(target.dataset.productQty)));$('#product-qty').textContent=productQuantity;updateLadderEstimate();return;}
  if(target.dataset.add){const p=findProduct(target.dataset.add);let lengthFeet=null;if(p.unit==='foot'){const input=$('#ladder-length');if(!input.reportValidity()||!input.value)return;lengthFeet=Number(input.value);}cart=normalizeCart([...cart,{id:p.id,size:selectedSize,quantity:productQuantity,lengthFeet}]);persistCart();setupMotion();notify(`${p.name} added to your bag.`);return;}
  if(target.hasAttribute('data-cart-qty')){const item=cart[Number(target.dataset.cartQty)];item.quantity+=Number(target.dataset.delta);cart=normalizeCart(cart);persistCart();const focusLabel=target.getAttribute('aria-label');render();const replacement=[...document.querySelectorAll('[data-cart-qty]')].find(x=>x.getAttribute('aria-label')===focusLabel);replacement?.focus();return;}
  if(target.hasAttribute('data-remove')){cart.splice(Number(target.dataset.remove),1);persistCart();render();notify('Item removed from your bag.');return;}
  if(target.hasAttribute('data-download-request'))downloadRequest();
  const href=target.getAttribute('href');if(target.tagName==='A'&&href?.startsWith('/')&&!href.startsWith('//')&&!target.hasAttribute('download')&&!target.target&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey){event.preventDefault();history.pushState(null,'',href);resetPhotoDepth(activeDepthCard);render();}
});
function updateLadderEstimate(){const input=$('#ladder-length');if(!input)return;const length=Number(input.value);const ladder=findProduct('bamboo-ladder');$('#ladder-estimate').textContent=input.value&&input.validity.valid?`${productQuantity} × ${length} ft: ${amountRange(length*productQuantity*ladder.price,length*productQuantity*ladder.priceMax)}`:'Enter a valid length (1–1000 feet, in half-foot increments).';}
document.addEventListener('input',event=>{if(event.target.id==='collection-search'){shopState.query=event.target.value;updateShop();}if(event.target.id==='ladder-length')updateLadderEstimate();});
document.addEventListener('change',event=>{if(event.target.id==='sort'){shopState.sort=event.target.value;updateShop();}if(event.target.name==='size')selectedSize=event.target.value;});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#mobile-nav')&&!$('#mobile-nav').hidden){$('#mobile-nav').hidden=true;$('[data-menu]').setAttribute('aria-expanded','false');$('[data-menu]').focus();}});
document.addEventListener('submit',async event=>{
  if(event.target.id==='search-form'){event.preventDefault();const q=new FormData(event.target).get('q');$('#search-dialog').close();location.hash='/shop?q='+encodeURIComponent(q);return;}
  if(event.target.id==='checkout-form'){
    event.preventDefault();if(!cart.length){location.hash='/cart';return;}
    const form=event.target;const details=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,String(v).trim()]));const errors=validateCheckout(details);
    form.querySelectorAll('[aria-invalid]').forEach(f=>{f.removeAttribute('aria-invalid');f.removeAttribute('aria-describedby');});form.querySelectorAll('.field-error').forEach(e=>e.textContent='');
    if(Object.keys(errors).length){for(const [key,message] of Object.entries(errors)){const input=form.elements[key];input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','error-'+key);$('#error-'+key).textContent=message;}const box=$('#checkout-errors');box.hidden=false;box.innerHTML=`<strong>Please check your details.</strong><ul>${Object.keys(errors).map(k=>`<li><a href="#${k}" data-scroll="${k}">${esc(form.querySelector(`label[for="${k}"]`).textContent)}: ${errors[k]}</a></li>`).join('')}</ul>`;box.focus();return;}
    const submit=form.querySelector('button[type="submit"]');if(submit.disabled)return;submit.disabled=true;submit.textContent='Submitting request…';try{await placeOrder(details,cart.map(x=>({...x})));location.hash='/orders';}catch(error){const box=$('#checkout-errors');if(box){box.hidden=false;box.textContent=error.message;box.focus();}}finally{submit.disabled=false;submit.textContent='Submit for owner approval →';}return;
  }
  if(event.target.id==='enquiry-form'){
    event.preventDefault();const form=event.target;if(!form.reportValidity())return;
    const details=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,String(v).trim()]));if(details.quantity&&(!Number.isInteger(Number(details.quantity))||Number(details.quantity)<1)){form.elements.quantity.setCustomValidity('Enter a whole quantity greater than zero.');form.elements.quantity.reportValidity();form.elements.quantity.addEventListener('input',()=>form.elements.quantity.setCustomValidity(''),{once:true});return;}
    lastRequest={kind:'enquiry',reference:'SBB-'+crypto.randomUUID().slice(0,8).toUpperCase(),details};
    const result=$('#enquiry-result');result.hidden=false;result.innerHTML=`<span class="eyebrow">READY TO SHARE</span><h3>Your enquiry is prepared.</h3><p>It has not been sent yet. ${hasContact()?'Choose a contact option below to send it.':'Download it to keep your requirements together.'}</p><pre class="request-preview">${esc(requestText(lastRequest))}</pre>${shareActions(lastRequest)}`;result.focus();result.scrollIntoView({block:'center',behavior:'instant'});
  }
});
let depthFrame=0;
let activeDepthCard=null;
let activeDepthBounds=null;
const reducedPhotoMotion=matchMedia('(prefers-reduced-motion: reduce)');
document.addEventListener('click',event=>{if(event.target.closest('[data-motion]'))syncPhotoDepthPreference();});
const finePhotoPointer=matchMedia('(hover: hover) and (pointer: fine)');
function resetPhotoDepth(card){
  cancelAnimationFrame(depthFrame);
  if(card)for(const property of ['--tilt-x','--tilt-y','--light-x','--light-y'])card.style.removeProperty(property);
  if(card===activeDepthCard){activeDepthCard=null;activeDepthBounds=null;}
}
document.addEventListener('pointermove',event=>{
  if(!motionEnabled()||!finePhotoPointer.matches)return;
  const card=event.target.closest?.('[data-depth]');if(!card)return;
  if(activeDepthCard!==card){resetPhotoDepth(activeDepthCard);activeDepthCard=card;activeDepthBounds=card.getBoundingClientRect();}
  const bounds=activeDepthBounds;
  const x=Math.max(0,Math.min(1,(event.clientX-bounds.left)/bounds.width));
  const y=Math.max(0,Math.min(1,(event.clientY-bounds.top)/bounds.height));
  cancelAnimationFrame(depthFrame);depthFrame=requestAnimationFrame(()=>{
    card.style.setProperty('--tilt-x',((.5-y)*9).toFixed(2)+'deg');
    card.style.setProperty('--tilt-y',((x-.5)*11).toFixed(2)+'deg');
    card.style.setProperty('--light-x',(x*100).toFixed(1)+'%');card.style.setProperty('--light-y',(y*100).toFixed(1)+'%');
  });
},{passive:true});
document.addEventListener('pointerout',event=>{
  const card=event.target.closest?.('[data-depth]');if(card&&!card.contains(event.relatedTarget))resetPhotoDepth(card);
});
function syncPhotoDepthPreference(){
  const toggle=$('[data-toggle-depth]');const stage=$('#product-main-image');if(!toggle||!stage)return;
  if(!motionEnabled()){
    resetPhotoDepth(stage);stage.classList.remove('is-depth');stage.removeAttribute('data-depth');toggle.disabled=true;toggle.setAttribute('aria-pressed','false');toggle.textContent='Reduced motion';
    document.querySelectorAll('[data-view-turn],[data-reset-depth]').forEach(b=>b.disabled=true);
  }else if(toggle.disabled){
    toggle.disabled=false;toggle.setAttribute('aria-pressed','true');toggle.textContent='3D view: On';stage.classList.add('is-depth');stage.setAttribute('data-depth','');
    document.querySelectorAll('[data-view-turn],[data-reset-depth]').forEach(b=>b.disabled=false);
  }
}
reducedPhotoMotion.addEventListener('change',()=>{if(reducedPhotoMotion.matches)resetPhotoDepth(activeDepthCard);syncPhotoDepthPreference();});
window.addEventListener('popstate',()=>{resetPhotoDepth(activeDepthCard);render();});
window.addEventListener('hashchange',()=>{resetPhotoDepth(activeDepthCard);render();});
window.addEventListener('storage',event=>{if(event.key==='sbb-cart'){try{cart=normalizeCart(JSON.parse(event.newValue||'[]'));}catch{cart=[];}renderHeader();setupMotion();if(['/cart','/checkout'].includes(location.pathname))render();}});
setupOrderEvents();
render();

})();
</script>
</body>
</html>
